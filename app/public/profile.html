<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Hub de Leitura</title></head><body><main><h1>Perfil do leitor</h1><p id="status">Carregando...</p><p id="reason"></p></main><script>const id=new URLSearchParams(location.search).get('id')||'2';fetch('/api/users/'+id+'/profile').then(r=>r.json()).then(u=>{document.querySelector('#status').textContent=u.name+' — '+u.status;document.querySelector('#reason').textContent=u.reason||'Nenhuma restrição ativa.'})</script></body></html>
