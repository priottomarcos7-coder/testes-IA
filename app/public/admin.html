<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo | Hub de Leitura</title><style>body{font:16px Arial;max-width:900px;margin:40px auto;padding:0 20px;color:#243044}button{padding:10px 16px;margin:8px 4px;cursor:pointer}pre{background:#f2f4f7;padding:16px;white-space:pre-wrap}</style></head><body><h1>Painel administrativo</h1><p id="summary">Carregando...</p><button id="refresh">Atualizar painel</button><button id="process">Processar bloqueios</button><h2>Usuários bloqueados</h2><pre id="blocked"></pre><p id="message" role="status"></p><script>const headers={'x-role':'admin'};async function load(){const [d,b]=await Promise.all([fetch('/api/admin/dashboard',{headers}),fetch('/api/admin/blocked',{headers})]);const data=await d.json(),list=await b.json();document.querySelector('#summary').textContent='Usuários: '+data.totalUsers+' | Bloqueados: '+data.blockedUsers;document.querySelector('#blocked').textContent=JSON.stringify(list.users,null,2)}document.querySelector('#refresh').onclick=load;document.querySelector('#process').onclick=async()=>{const r=await fetch('/api/admin/process',{method:'POST',headers});const j=await r.json();document.querySelector('#message').textContent=j.message;load()};load();</script></body></html>
