name: Testes automatizados
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm start &
      - name: Aguardar API
        run: node -e "const wait=async()=>{for(let i=0;i<30;i++){try{const r=await fetch('http://localhost:3000/api/health');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()"
      - run: npm test
